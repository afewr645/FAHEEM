const root=document.getElementById('twx38-root');
if(!root)return;
const sections=[...new Set(BANK.map(q=>q.section))];
const topics=[...new Set(BANK.map(q=>q.topic))];
let state={pool:[],index:0,selected:null,answered:false,correct:0,attempted:0,skipped:0,history:[],timer:null,seconds:45,started:false};
const $=(s)=>root.querySelector(s);
root.innerHTML=`<div class="twx-shell">
 <div class="twx-hero"><div class="twx-kicker">TWX38 • Competitive Exam Practice</div><h1>Quantitative Aptitude Master Quiz</h1><p class="twx-sub">1,000 MCQs • SSC • Railway • PSC • SET/NET • Aptitude Practice</p></div>
 <div class="twx-body">
  <div class="twx-stats"><div class="twx-stat"><b id="twx-total">1,000</b><span>Question bank</span></div><div class="twx-stat"><b id="twx-done">0</b><span>Answered</span></div><div class="twx-stat"><b id="twx-score">0</b><span>Correct</span></div><div class="twx-stat"><b id="twx-accuracy">0%</b><span>Accuracy</span></div></div>
  <div id="twx-setup" class="twx-panel">
   <div class="twx-controls"><div><label for="twx-section">Choose section</label><select id="twx-section"><option value="all">All sections</option>${sections.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label for="twx-count">Quiz length</label><select id="twx-count"><option value="10">10 questions</option><option value="25">25 questions</option><option value="50">50 questions</option><option value="100">100 questions</option><option value="all">All available</option></select></div></div>
   <label for="twx-topic">Choose topic</label><select id="twx-topic"><option value="all">All topics in selected section</option>${topics.map(x=>`<option>${x}</option>`).join('')}</select>
   <div class="twx-small" id="twx-available">1,000 questions available.</div>
   <div class="twx-actions"><button class="twx-primary" id="twx-start">Start quiz</button><span class="twx-small">Questions are randomized at the start.</span></div>
  </div>
  <div id="twx-game" class="twx-panel twx-hidden">
   <div class="twx-meta"><span id="twx-position">Question 1</span><span id="twx-topic-label"></span><span class="twx-timer" id="twx-timer">45s</span></div>
   <div class="twx-progress"><div id="twx-bar"></div></div>
   <div class="twx-qtop"><span class="twx-chip" id="twx-section-label"></span><span class="twx-small">15-second skip reflex • 45-second target</span></div>
   <div class="twx-question" id="twx-question"></div>
   <div id="twx-options"></div>
   <div id="twx-feedback" class="twx-feedback twx-hidden"></div>
   <div class="twx-actions"><button class="twx-primary" id="twx-submit" disabled>Check answer</button><button class="twx-secondary twx-hidden" id="twx-next">Next question</button><button class="twx-quiet" id="twx-skip">Skip question</button><button class="twx-quiet" id="twx-exit">End quiz</button></div>
  </div>
  <div id="twx-result" class="twx-panel twx-hidden"></div>
 </div><div class="twx-foot">TWX38 Quantitative Aptitude • Scores are calculated for each quiz session.</div>
</div>`;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateStats(){ $('#twx-done').textContent=state.attempted; $('#twx-score').textContent=state.correct; $('#twx-accuracy').textContent=(state.attempted?Math.round(state.correct/state.attempted*100):0)+'%'; }
function filtered(){const s=$('#twx-section').value,t=$('#twx-topic').value;return BANK.filter(q=>(s==='all'||q.section===s)&&(t==='all'||q.topic===t));}
function updateTopics(){const s=$('#twx-section').value;const ts=[...new Set(BANK.filter(q=>s==='all'||q.section===s).map(q=>q.topic))];$('#twx-topic').innerHTML='<option value="all">All topics in selected section</option>'+ts.map(t=>`<option>${t}</option>`).join(''); updateAvailable();}
function updateAvailable(){const n=filtered().length;$('#twx-available').textContent=n.toLocaleString()+' questions available for this selection.';}
function start(){clearInterval(state.timer);let pool=shuffle(filtered().slice());let count=$('#twx-count').value==='all'?pool.length:Math.min(Number($('#twx-count').value),pool.length);state={pool:pool.slice(0,count),index:0,selected:null,answered:false,correct:0,attempted:0,skipped:0,history:[],timer:null,seconds:45,started:true};$('#twx-setup').classList.add('twx-hidden');$('#twx-result').classList.add('twx-hidden');$('#twx-game').classList.remove('twx-hidden');updateStats();render();}
function render(){clearInterval(state.timer);if(state.index>=state.pool.length){finish();return;}const q=state.pool[state.index];state.selected=null;state.answered=false;state.seconds=45;$('#twx-position').textContent=`Question ${state.index+1} of ${state.pool.length}`;$('#twx-topic-label').textContent=q.topic;$('#twx-section-label').textContent=q.section;$('#twx-question').textContent=q.question;$('#twx-options').innerHTML=q.options.map((o,i)=>`<label class="twx-option"><input type="radio" name="twx-answer" value="${i}"><span><b>${String.fromCharCode(65+i)}.</b> ${o}</span></label>`).join('');$('#twx-feedback').classList.add('twx-hidden');$('#twx-next').classList.add('twx-hidden');$('#twx-submit').classList.remove('twx-hidden');$('#twx-submit').disabled=true;$('#twx-skip').disabled=false;$('#twx-bar').style.width=(state.index/state.pool.length*100)+'%';$('#twx-options').querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{state.selected=Number(inp.value);$('#twx-submit').disabled=false;$('#twx-options').querySelectorAll('.twx-option').forEach(x=>x.classList.remove('twx-picked'));inp.closest('.twx-option').classList.add('twx-picked');}));$('#twx-timer').textContent='45s';state.timer=setInterval(()=>{state.seconds--;$('#twx-timer').textContent=state.seconds+'s';if(state.seconds===15)$('#twx-timer').textContent='15s • consider skipping';if(state.seconds<=0){clearInterval(state.timer);skip(true);}},1000);}
function submit(){if(state.selected===null||state.answered)return;clearInterval(state.timer);const q=state.pool[state.index],ok=state.selected===q.answer;state.answered=true;state.attempted++;if(ok)state.correct++;state.history.push({q,selected:state.selected,correct:ok,skipped:false});updateStats();$('#twx-options').querySelectorAll('input').forEach(x=>x.disabled=true);$('#twx-submit').classList.add('twx-hidden');$('#twx-skip').disabled=true;$('#twx-next').classList.remove('twx-hidden');$('#twx-feedback').classList.remove('twx-hidden');$('#twx-feedback').innerHTML=`<div class="${ok?'twx-correct':'twx-wrong'}">${ok?'Correct answer!':'Not quite. Correct answer: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]}</div><div style="margin-top:7px">${q.explanation}</div>`;$('#twx-bar').style.width=((state.index+1)/state.pool.length*100)+'%';}
function skip(auto=false){if(state.answered)return;clearInterval(state.timer);const q=state.pool[state.index];state.skipped++;state.history.push({q,selected:null,correct:false,skipped:true});state.answered=true;$('#twx-options').querySelectorAll('input').forEach(x=>x.disabled=true);$('#twx-submit').classList.add('twx-hidden');$('#twx-skip').disabled=true;$('#twx-next').classList.remove('twx-hidden');$('#twx-feedback').classList.remove('twx-hidden');$('#twx-feedback').innerHTML=`<div class="twx-wrong">${auto?'Time is up.':'Question skipped.'} Correct answer: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</div><div style="margin-top:7px">${q.explanation}</div>`;$('#twx-bar').style.width=((state.index+1)/state.pool.length*100)+'%';}
function next(){if(!state.answered)return;state.index++;render();}
function finish(){clearInterval(state.timer);$('#twx-game').classList.add('twx-hidden');const total=state.pool.length;const acc=state.attempted?Math.round(state.correct/state.attempted*100):0;const res=$('#twx-result');res.classList.remove('twx-hidden');res.innerHTML=`<h2 style="margin:0 0 8px;color:#173b79">Quiz completed!</h2><div class="twx-stats"><div class="twx-stat"><b>${state.correct}/${total}</b><span>Correct score</span></div><div class="twx-stat"><b>${acc}%</b><span>Accuracy</span></div><div class="twx-stat"><b>${state.skipped}</b><span>Skipped</span></div><div class="twx-stat"><b>${total-state.correct-state.skipped}</b><span>Wrong</span></div></div><div class="twx-progress"><div style="width:${acc}%"></div></div><p>${acc>=80?'Strong performance. Keep practising advanced questions.':acc>=60?'Good effort. Review the explanations and try again.':'Use the review below to strengthen the basics, then retake the quiz.'}</p><div class="twx-actions"><button class="twx-primary" id="twx-retake">Retake same selection</button><button class="twx-secondary" id="twx-home">Choose another topic</button><button class="twx-quiet" id="twx-review-toggle">Show answer review</button></div><div id="twx-review" class="twx-hidden" style="margin-top:14px"></div>`;
$('#twx-retake').onclick=start;$('#twx-home').onclick=()=>{$('#twx-result').classList.add('twx-hidden');$('#twx-setup').classList.remove('twx-hidden');};$('#twx-review-toggle').onclick=()=>{const box=$('#twx-review');if(box.classList.contains('twx-hidden')){box.classList.remove('twx-hidden');box.innerHTML=state.history.map((h,i)=>`<div class="twx-review-item"><b>${i+1}. ${h.q.question.replace(/\n/g,'<br>')}</b><div class="twx-small">${h.q.topic} • ${h.skipped?'Skipped':h.correct?'Correct':'Incorrect'}</div><div>Your answer: ${h.selected===null?'—':String.fromCharCode(65+h.selected)+'. '+h.q.options[h.selected]}</div><div>Correct: ${String.fromCharCode(65+h.q.answer)}. ${h.q.options[h.q.answer]}</div><div class="twx-small">${h.q.explanation}</div></div>`).join('');$('#twx-review-toggle').textContent='Hide answer review';}else{box.classList.add('twx-hidden');$('#twx-review-toggle').textContent='Show answer review';}};$('#twx-bar').style.width='100%';updateStats();}
$('#twx-section').addEventListener('change',updateTopics);$('#twx-topic').addEventListener('change',updateAvailable);$('#twx-start').addEventListener('click',start);$('#twx-submit').addEventListener('click',submit);$('#twx-next').addEventListener('click',next);$('#twx-skip').addEventListener('click',()=>skip(false));$('#twx-exit').addEventListener('click',finish);updateAvailable();
})();
</script></body></html>
